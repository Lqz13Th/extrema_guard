[package]
name = "extrema_guard"
version = "0.1.5"
edition = "2024"
readme = "README.md"
license = "Apache-2.0"
description = "Composable guard strategy modules built on extrema_infra."
repository = "https://github.com/Lqz13Th/extrema_guard"
homepage = "https://github.com/Lqz13Th/extrema_guard"
documentation = "https://docs.rs/extrema_guard"
keywords = ["crypto", "trading", "risk-management", "order-management"]
categories = ["finance"]

[lib]
name = "extrema_guard"
path = "src/lib.rs"

[[bin]]
name = "guard"
path = "src/main.rs"

[[example]]
name = "guard_custom_template"
path = "examples/guard_custom_template.rs"

[package.metadata.docs.rs]
all-features = true

[dependencies]
extrema_infra = { version = "0.3.12", features = ["lob_clients"] }
rustls = { version = "0.23.43", features = ["aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
