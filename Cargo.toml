[package]
name = "extrema_guard"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Composable account and order guard runtime built on extrema_infra."
repository = "https://github.com/Lqz13Th/extrema_guard"
keywords = ["crypto", "trading", "risk-management", "order-management"]
categories = ["finance"]

[lib]
name = "extrema_guard"
path = "src/lib.rs"

[[bin]]
name = "guard"
path = "src/main.rs"

[[bin]]
name = "guard_custom_template"
path = "src/bin/guard_custom_template.rs"

[dependencies]
extrema_infra = { version = "0.3.5", features = ["lob_clients"] }
rustls = { version = "0.23.43", features = ["aws-lc-rs"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
